<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>STRAYD Content Generator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
        .container { max-width: 650px; margin: auto; background: #161b22; padding: 30px; border-radius: 8px; border: 1px solid #30363d; }
        h1 { color: #f0f6fc; font-size: 22px; margin-top: 0; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #8b949e; }
        input[type="password"], input[type="text"] { width: 100%; padding: 10px; margin-top: 5px; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; border-radius: 6px; box-sizing: border-box; }
        .checkbox-group { margin-top: 8px; background: #0d1117; padding: 12px; border: 1px solid #30363d; border-radius: 6px; }
        .checkbox-group label { display: inline-block; margin-right: 20px; font-weight: normal; color: #c9d1d9; cursor: pointer; }
        button { width: 100%; padding: 12px; background: #238636; color: white; border: none; font-weight: bold; font-size: 15px; border-radius: 6px; cursor: pointer; margin-top: 25px; }
        button:hover { background: #2ea043; }
        #status-box { margin-top: 20px; padding: 15px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; min-height: 70px; font-family: monospace; white-space: pre-wrap; font-size: 13px; color: #58a6ff; }
        .links-section { margin-top: 20px; display: none; }
        a.download-btn { display: inline-block; padding: 8px 14px; background: #1f6feb; color: white; text-decoration: none; border-radius: 6px; margin-right: 10px; margin-top: 10px; font-size: 14px; }
        a.download-btn:hover { background: #388bfd; }
    </style>
</head>
<body>
<div class="container">
    <h1>STRAYD Content Command Center</h1>
    <p>Choose character knowledge sources and click start.</p>

    <!-- Pre-fill or save your repo configuration once below -->
    <details style="margin-bottom: 15px; font-size: 13px; color: #8b949e;">
        <summary style="cursor: pointer;">Repository Settings (Click to configure)</summary>
        <label>GitHub Personal Access Token (repo scope):</label>
        <input type="password" id="gh-token" placeholder="ghp_..." value="">
        <label>GitHub Owner / Username:</label>
        <input type="text" id="gh-owner" placeholder="your-github-username" value="">
        <label>Repository Name:</label>
        <input type="text" id="gh-repo" placeholder="strayd-social-agent" value="">
    </details>

    <label>Select Knowledge / Characters (Choose one or more):</label>
    <div class="checkbox-group">
        <label><input type="checkbox" name="char" value="martinstrayd" checked> Martin Strayd</label>
        <label><input type="checkbox" name="char" value="suzuki" checked> Suzuki</label>
    </div>

    <button onclick="startGeneration()">Start Content Generation</button>

    <label>Live Progress:</label>
    <div id="status-box">Ready. Select your characters and click start.</div>

    <div class="links-section" id="links-section">
        <label>View Complete Results:</label>
        <div id="download-links"></div>
    </div>
</div>

<script>
    async function startGeneration() {
        const token = document.getElementById('gh-token').value.trim();
        const owner = document.getElementById('gh-owner').value.trim();
        const repo = document.getElementById('gh-repo').value.trim();
        const statusBox = document.getElementById('status-box');

        const checkboxes = document.querySelectorAll('input[name="char"]:checked');
        const selectedChars = Array.from(checkboxes).map(cb => cb.value);

        if (!token || !owner || !repo) {
            alert('Please expand "Repository Settings" and fill in your Token, Owner, and Repo name.');
            return;
        }
        if (selectedChars.length === 0) {
            alert('Please select at least one character knowledge base.');
            return;
        }

        statusBox.textContent = "Dispatching workflow with selected character(s)...";

        try {
            // Using repository_dispatch event to pass custom character payload safely
            const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/dispatches`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/vnd.github+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    event_type: 'generate-social-content',
                    client_payload: {
                        characters: selectedChars.join(',')
                    }
                })
            });

            if (!response.ok) {
                const err = await response.text();
                throw new Error(`Dispatch failed: ${response.status} - ${err}`);
            }

            statusBox.textContent = "Workflow triggered successfully! Waiting for agent execution...";
            pollProgress(token, owner, repo);

        } catch (error) {
            statusBox.textContent = `Error: ${error.message}`;
        }
    }

    async function pollProgress(token, owner, repo) {
        const statusBox = document.getElementById('status-box');
        for (let i = 0; i < 60; i++) {
            await new Promise(r => setTimeout(r, 5000));
            try {
                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/runs?per_page=1`, {
                    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json' }
                });
                const data = await res.json();
                if (data.workflow_runs && data.workflow_runs.length > 0) {
                    const run = data.workflow_runs[0];
                    statusBox.textContent = `Status: ${run.status.toUpperCase()} (${run.conclusion || 'running'})...`;

                    if (run.status === 'completed') {
                        if (run.conclusion === 'success') {
                            statusBox.textContent += "\n\nCOMPLETE! All posts successfully generated and committed.";
                            showLinks(owner, repo);
                        } else {
                            statusBox.textContent += `\n\nFinished with conclusion: ${run.conclusion}`;
                        }
                        return;
                    }
                }
            } catch (e) {
                console.log("Polling check:", e);
            }
        }
        statusBox.textContent += "\n\nTimed out waiting for run status update.";
    }

    function showLinks(owner, repo) {
        document.getElementById('links-section').style.display = 'block';
        document.getElementById('download-links').innerHTML = `
            <a class="download-btn" href="https://github.com/${owner}/${repo}/tree/main/social-posts/weekly" target="_blank">View Weekly Files</a>
            <a class="download-btn" href="https://github.com/${owner}/${repo}/tree/main/social-posts/daily" target="_blank">View Daily Files</a>
        `;
    }
</script>
</body>
</html>
