<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>STRAYD Content Command Center</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 25px; }
        .container { max-width: 600px; margin: auto; background: #161b22; padding: 30px; border-radius: 8px; border: 1px solid #30363d; }
        h1 { color: #f0f6fc; font-size: 22px; margin-top: 0; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #8b949e; }
        .checkbox-group { margin-top: 10px; background: #0d1117; padding: 15px; border: 1px solid #30363d; border-radius: 6px; }
        .checkbox-group label { display: block; margin-bottom: 8px; font-weight: normal; color: #c9d1d9; cursor: pointer; font-size: 15px; }
        button.start-btn { width: 100%; padding: 14px; background: #238636; color: white; border: none; font-weight: bold; font-size: 16px; border-radius: 6px; cursor: pointer; margin-top: 25px; }
        button.start-btn:hover { background: #2ea043; }
        .hint { font-size: 13px; color: #8b949e; margin-top: 10px; line-height: 1.4; }
    </style>
</head>
<body>
<div class="container">
    <h1>STRAYD Content Command Center</h1>
    <p>Select your character knowledge base and launch generation instantly.</p>

    <label>Select Knowledge / Characters (Choose one or more):</label>
    <div class="checkbox-group">
        <label><input type="checkbox" name="char" value="martinstrayd" checked> Martin Strayd (martinstrayd.md)</label>
        <label><input type="checkbox" name="char" value="suzuki" checked> Suzuki (suzuki.md)</label>
    </div>

    <button class="start-btn" onclick="launchAgent()">Launch Content Generation Agent</button>
    
    <div class="hint">
        <strong>How this works:</strong> Clicking launch opens GitHub's secure native runner page with your repository workflow ready to execute—no tokens, passwords, or configuration required!
    </div>
</div>

<script>
    function launchAgent() {
        const checkboxes = document.querySelectorAll('input[name="char"]:checked');
        const selectedChars = Array.from(checkboxes).map(cb => cb.value);

        if (selectedChars.length === 0) {
            alert('Please select at least one character knowledge base.');
            return;
        }

        // Opens GitHub Actions workflow page directly
        const repoUrl = "https://github.com/suzukistrayd/ai-head-office/actions/workflows/social-agent-multi.yml";
        window.open(repoUrl, '_blank');
    }
</script>
</body>
</html>
