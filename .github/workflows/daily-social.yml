name: Daily Social Posts

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: suzukistrayd/ai-head-office

      - name: Generate X with knowledge
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          mkdir -p content/drafts
          DATE=$(date +%Y-%m-%d)
          
          # Read knowledge files
          BRAND=$(cat knowledge/brand/strayd.md 2>/dev/null || echo "")
          SUZUKI=$(cat characters/suzuki/-index.md 2>/dev/null || echo "")
          MARTIN=$(cat characters/martin-strayd/-index.md 2>/dev/null || echo "")
          
          # Build context
          CONTEXT="KNOWLEDGE:\n$BRAND\n$SUZUKI\n$MARTIN\n\nINSTRUCTION: Use only facts above. Do not invent information."
          
          # X with knowledge
          curl -s -X POST https://inference.dahl.global/v1/chat/completions \
            -H "Authorization: Bearer $DAHL_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"MiniMaxAI/MiniMax-M2.7\",\"messages\":[{\"role\":\"user\",\"content\":\"$CONTEXT\n\nWrite 1 X post. Under 280 chars. Rock. 2-3 hashtags.\"}]}" \
            | python3 -c "import sys,json; open('content/drafts/x-$DATE.md','w').write('# X Post\n\n' + json.load(sys.stdin)['choices'][0]['message']['content'])"
          
          echo "=== X created ==="
          cat content/drafts/x-$DATE.md

      - name: Commit
        run: |
          git add content/drafts/
          git commit -m "Daily content $DATE"
          git push
