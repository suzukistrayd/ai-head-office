name: Daily Social Posts - Full Knowledge

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: suzukistrayd/ai-head-office
      
      - name: Load Knowledge Base
        id: knowledge
        run: |
          echo "=== LOADING KNOWLEDGE ==="
          if [ -f knowledge/brand/strayd.md ]; then
            echo "✅ Brand knowledge found"
            cat knowledge/brand/strayd.md
          else
            echo "❌ No brand knowledge"
          fi
          echo "---"
          if [ -f characters/suzuki/-index.md ]; then
            echo "✅ Suzuki found"
          fi
          if [ -f characters/martin-strayd/-index.md ]; then
            echo "✅ Martin found"
          fi

      - name: Generate X Post (Rock, Sharp, 280 chars)
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          PROMPT="You are social media manager for STRAYD featuring Martin Strayd (Australian rock musician, 55) and Suzuki (Thai-Japanese media manager, 36). Brand: Anti-Pop Rock. Message: 'Real music. Real people. Real lives. No waiting for permission.' Style: Witty, sharp, rock and roll attitude. NEVER invent events, shows, releases. Use only verified brand info. Generate 1 X/Twitter post. Under 280 chars. Rock vibe. 2-3 hashtags. Make it punchy."
          
          response=$(curl -s https://inference.dahl.global/v1/chat/completions \
            -H "Authorization: Bearer $DAHL_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\": \"MiniMaxAI/MiniMax-M2.7\", \"messages\": [{\"role\": \"user\", \"content\": \"$PROMPT\"}]}")
          
          echo "$response" | jq -r '.choices[0].message.content' > content/drafts/x-$(date +%Y-%m-%d).txt
          echo "=== X POST ===" && cat content/drafts/x-$(date +%Y-%m-%d).txt

      - name: Generate Instagram (Hook + Story + Hashtags)
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          PROMPT="STRAYD featuring Martin Strayd (Australian rock guitarist, songwriter) and Suzuki (Thai-Japanese media manager). Anti-Pop Rock. 'Real music. Real people. Real lives. No waiting for permission.' NEVER invent releases or shows. Generate 1 Instagram caption. Structure: HOOK first line (bold/attention), BODY 2-3 sentences (story-driven, rock energy), 5 relevant hashtags. End with: real music. real people."
          
          response=$(curl -s https://inference.dahl.global/v1/chat/completions \
            -H "Authorization: Bearer $DAHL_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\": \"MiniMaxAI/MiniMax-M2.7\", \"messages\": [{\"role\": \"user\", \"content\": \"$PROMPT\"}]}")
          
          echo "$response" | jq -r '.choices[0].message.content' > content/drafts/ig-$(date +%Y-%m-%d).txt
          echo "=== INSTAGRAM ===" && cat content/drafts/ig-$(date +%Y-%m-%d).txt

      - name: Generate TikTok (Hook + Story + 60 sec)
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          PROMPT="STRAYD social media. Martin Strayd (Australian rock, 55, guitarist, songwriter). Suzuki (media manager, 36). Anti-Pop Rock. NEVER invent. Generate TikTok script: HOOK first 3 seconds (grab attention), STORY ARC (build 30-45 sec), ENDING (call to action). 3-5 hashtags. Rock vibe. Under 60 seconds total."
          
          response=$(curl -s https://inference.dahl.global/v1/chat/completions \
            -H "Authorization: Bearer $DAHL_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\": \"MiniMaxAI/MiniMax-M2.7\", \"messages\": [{\"role\": \"user\", \"content\": \"$PROMPT\"}]}")
          
          echo "$response" | jq -r '.choices[0].message.content' > content/drafts/tt-$(date +%Y-%m-%d).txt
          echo "=== TIKTOK ===" && cat content/drafts/tt-$(date +%Y-%m-%d).txt

      - name: Generate Facebook (Story-driven, Community)
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          PROMPT="STRAYD. Martin Strayd (Australian rock, independent musician). Suzuki (band manager). Anti-Pop Rock. NEVER invent. Generate Facebook post: Story-driven, rock vibe, community feel, 2-4 sentences, emoji适量, include call to action. End with real music. real people."
          
          response=$(curl -s https://inference.dahl.global/v1/chat/completions \
            -H "Authorization: Bearer $DAHL_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\": \"MiniMaxAI/MiniMax-M2.7\", \"messages\": [{\"role\": \"user\", \"content\": \"$PROMPT\"}]}")
          
          echo "$response" | jq -r '.choices[0].message.content' > content/drafts/fb-$(date +%Y-%m-%d).txt
          echo "=== FACEBOOK ===" && cat content/drafts/fb-$(date +%Y-%m-%d).txt

      - name: Generate YouTube (SEO optimized, longer)
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          PROMPT="STRAYD featuring Martin Strayd & Suzuki. Anti-Pop Rock. NEVER invent. Generate YouTube video description: HOOK first 150 chars (make them click), MAIN DESCRIPTION 2-3 paragraphs (story, what to expect), TIMESTAMPS placeholder section, LINKS section (website, socials), SEO TAGS (10 comma-separated keywords). End: real music. real people. real stories."
          
          response=$(curl -s https://inference.dahl.global/v1/chat/completions \
            -H "Authorization: Bearer $DAHL_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\": \"MiniMaxAI/MiniMax-M2.7\", \"messages\": [{\"role\": \"user\", \"content\": \"$PROMPT\"}]}")
          
          echo "$response" | jq -r '.choices[0].message.content' > content/drafts/yt-$(date +%Y-%m-%d).txt
          echo "=== YOUTUBE ===" && cat content/drafts/yt-$(date +%Y-%m-%d).txt

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/drafts/
          git commit -m "Daily content $(date +%Y-%m-%d)" || echo "No changes"
          git push || echo "Push done"
