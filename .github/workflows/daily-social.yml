name: Daily Social

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: suzukistrayd/ai-head-office

      - name: Make X post
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          pip install requests -q
          python3 -c "import os,requests; from datetime import date; t=date.today().isoformat(); os.makedirs('content/drafts',exist_ok=True); r=requests.post('https://inference.dahl.global/v1/chat/completions',json={'model':'MiniMaxAI/MiniMax-M2.7','messages':[{'role':'user','content':'STRAYD featuring Martin Strayd and Suzuki. Anti-Pop Rock and Roll. Write ONE X post. Under 280 chars. Rock. 2-3 hashtags. Output ONLY.'}]},headers={'Authorization':'Bearer '+os.environ['DAHL_API_KEY']},timeout=60); open(f'content/drafts/x-{t}.md','w').write('# X\n\n'+r.json()['choices'][0]['message']['content'])"

      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@strayd.com"
          git add -A
          git commit -m "x post"
          git push origin main
