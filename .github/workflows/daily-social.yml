name: Daily Social Posts

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: suzukistrayd/ai-head-office

      - name: Generate X Post
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          mkdir -p content/drafts
          DATE=$(date +%Y-%m-%d)
          curl -s -X POST https://inference.dahl.global/v1/chat/completions \
            -H "Authorization: Bearer $DAHL_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"model":"MiniMaxAI/MiniMax-M2.7","messages":[{"role":"user","content":"STRAYD featuring Martin Strayd and Suzuki. Anti-Pop Rock and Roll. Write 1 X post. Under 280 chars. Rock. 2-3 hashtags."}]}' \
            > /tmp/response.json
          python3 -c "import json; open('content/drafts/x-'+'$DATE'+'.md','w').write('# X Post\n\n' + json.load(open('/tmp/response.json'))['choices'][0]['message']['content'])"

      - name: Commit
        run: |
          git add content/drafts/
          git commit -m "Daily content $(date +%Y-%m-%d)"
          git push origin main
