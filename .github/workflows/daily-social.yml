name: Daily Social Posts

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: suzukistrayd/ai-head-office

      - name: Generate content with knowledge
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          pip install requests -q
          python3 <<EOF
import os, requests
from datetime import date

# Load knowledge
brand = ""
if os.path.exists('knowledge/brand/strayd.md'):
    brand = open('knowledge/brand/strayd.md').read()
    print("Brand loaded:", len(brand), "chars")

suzuki = ""
if os.path.exists('characters/suzuki/-index.md'):
    suzuki = open('characters/suzuki/-index.md').read()
    print("Suzuki loaded:", len(suzuki), "chars")

martin = ""
if os.path.exists('characters/martin-strayd/-index.md'):
    martin = open('characters/martin-strayd/-index.md').read()
    print("Martin loaded:", len(martin), "chars")

# Build context
context = f"""STRAYD BRAND INFO:
{brand}

SUZUKI INFO:
{suzuki}

MARTIN STRAYD INFO:
{martin}"""

a=os.environ['DAHL_API_KEY']
u='https://inference.dahl.global/v1/chat/completions'
h={'Authorization':f'Bearer {a}','Content-Type':'application/json'}
def g(m):
 r=requests.post(u,json={'model':'MiniMaxAI/MiniMax-M2.7','messages':[{'role':'user','content':context[:8000]+'\n\n'+m}]},headers=h,timeout=30)
 return r.json()['choices'][0]['message']['content']

t=date.today().isoformat()
os.makedirs('content/drafts',exist_ok=True)

open(f'content/drafts/x-{t}.md','w').write('# X Post\n\n'+g('Write 1 X/Twitter post. Under 280 chars. Rock vibe. 2-3 hashtags. Witty.'))
open(f'content/drafts/ig-{t}.md','w').write('# Instagram Caption\n\n'+g('Write 1 Instagram caption. Hook first line. 5 hashtags.'))
open(f'content/drafts/tt-{t}.md','w').write('# TikTok Script\n\n'+g('Write TikTok script. Hook 3sec, story arc, ending CTA, 3-5 hashtags.'))
open(f'content/drafts/fb-{t}.md','w').write('# Facebook Post\n\n'+g('Write Facebook post. Story-driven. Emoji. Call to action.'))

print('\nFiles:', os.listdir('content/drafts'))
EOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/drafts/
          git commit -m "Social content $(date +%Y-%m-%d)"
          git push origin main
