name: Daily Social Posts

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: suzukistrayd/ai-head-office

      - name: Generate content
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          pip install requests -q
          python3 -c "
import os, requests, json
from datetime import date

# Load knowledge
with open('knowledge/brand/strayd.md', 'r') as f: brand = f.read()
with open('characters/suzuki/-index.md', 'r') as f: suzuki = f.read()
with open('characters/martin-strayd/-index.md', 'r') as f: martin = f.read()

TRUTH = brand + '\n' + suzuki + '\n' + martin

api_key = os.environ['DAHL_API_KEY']
url = 'https://inference.dahl.global/v1/chat/completions'
headers = {'Authorization': 'Bearer ' + api_key, 'Content-Type': 'application/json'}

def gen(msg):
    data = {'model': 'MiniMaxAI/MiniMax-M2.7', 'messages': [{'role': 'user', 'content': TRUTH[:5000] + '\n\n' + msg}]}
    try:
        r = requests.post(url, json=data, headers=headers, timeout=60)
        result = r.json()
        if 'choices' in result:
            return result['choices'][0]['message']['content']
        else:
            print('API Error:', result)
            return 'ERROR: ' + str(result)
    except Exception as e:
        print('Exception:', e)
        return 'ERROR: ' + str(e)

t = date.today().isoformat()
os.makedirs('content/drafts', exist_ok=True)

x = gen('X post. Under 280 chars. Rock. 2-3 hashtags.')
open(f'content/drafts/x-{t}.md', 'w').write('# X Post\n\n' + x)

ig = gen('Instagram caption. Hook first. 5 hashtags.')
open(f'content/drafts/ig-{t}.md', 'w').write('# Instagram\n\n' + ig)

tt = gen('TikTok script. Hook 3sec. Story. CTA.')
open(f'content/drafts/tt-{t}.md', 'w').write('# TikTok\n\n' + tt)

fb = gen('Facebook post. Story. Emoji. CTA.')
open(f'content/drafts/fb-{t}.md', 'w').write('# Facebook\n\n' + fb)

print('Done:', os.listdir('content/drafts'))
"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/drafts/
          git commit -m "Social content $(date +%Y-%m-%d)"
          git push origin main
