name: Daily Social Posts

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: suzukistrayd/ai-head-office

      - name: Check files
        run: |
          ls -la
          ls -la knowledge/
          ls -la characters/

      - name: Generate content
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          pip install requests -q
          python3 << 'PYEOF'
import os, requests
from datetime import date

# Load knowledge
brand = open('knowledge/brand/strayd.md').read()
suzuki = open('characters/suzuki/-index.md').read()
martin = open('characters/martin-strayd/-index.md').read()

TRUTH = brand + "\n" + suzuki + "\n" + martin

api_key = os.environ["DAHL_API_KEY"]
url = "https://inference.dahl.global/v1/chat/completions"
headers = {"Authorization": "Bearer " + api_key, "Content-Type": "application/json"}

def gen(msg):
    r = requests.post(url, json={"model": "MiniMaxAI/MiniMax-M2.7", "messages": [{"role": "user", "content": TRUTH[:5000] + "\n\n" + msg}]}, headers=headers, timeout=60)
    return r.json()["choices"][0]["message"]["content"]

t = date.today().isoformat()
os.makedirs("content/drafts", exist_ok=True)

x = gen("X post. Under 280 chars. Rock. 2-3 hashtags.")
open(f"content/drafts/x-{t}.md", "w").write("# X Post\n\n" + x)
print("X done:", x[:50])

ig = gen("Instagram caption. Hook first. 5 hashtags.")
open(f"content/drafts/ig-{t}.md", "w").write("# Instagram\n\n" + ig)
print("IG done:", ig[:50])

tt = gen("TikTok script. Hook 3sec. Story. CTA.")
open(f"content/drafts/tt-{t}.md", "w").write("# TikTok\n\n" + tt)
print("TT done:", tt[:50])

fb = gen("Facebook post. Story. Emoji. CTA.")
open(f"content/drafts/fb-{t}.md", "w").write("# Facebook\n\n" + fb)
print("FB done:", fb[:50])

print("Files:", os.listdir("content/drafts"))
PYEOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/drafts/
          git commit -m "Social content $(date +%Y-%m-%d)"
          git push origin main
