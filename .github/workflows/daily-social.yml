name: Daily Social Posts

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: suzukistrayd/ai-head-office

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Generate content
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          python3 -c "
import os
import requests
from datetime import date

api_key = os.environ['DAHL_API_KEY']
url = 'https://inference.dahl.global/v1/chat/completions'
headers = {'Authorization': f'Bearer {api_key}', 'Content-Type': 'application/json'}

def gen(prompt):
    try:
        resp = requests.post(url, json={'model': 'MiniMaxAI/MiniMax-M2.7', 'messages': [{'role': 'user', 'content': prompt}]}, headers=headers, timeout=30)
        return resp.json()['choices'][0]['message']['content']
    except Exception as e:
        return f'Error: {e}'

os.makedirs('content/drafts', exist_ok=True)
today = date.today().isoformat()

x = gen('STRAYD featuring Martin Strayd (Australian rock musician, guitarist, songwriter) and Suzuki (Thai-Japanese media manager, band manager). Anti-Pop Rock and Roll. Message: Real music. Real people. Real lives. No waiting for permission. Write 1 X/Twitter post. Under 280 chars. Rock vibe. 2-3 hashtags. Witty and sharp.')
open(f'content/drafts/x-{today}.md', 'w').write(f'# X Post\n\n{x}')

ig = gen('STRAYD featuring Martin Strayd (Australian rock, guitarist, songwriter) and Suzuki (Thai-Japanese media manager). Anti-Pop Rock and Roll. Message: Real music. Real people. Real lives. No waiting for permission. Write 1 Instagram caption. Hook first line. Body 2-3 sentences with rock energy. 5 hashtags. End with: real music. real people.')
open(f'content/drafts/ig-{today}.md', 'w').write(f'# Instagram Caption\n\n{ig}')

tt = gen('STRAYD featuring Martin Strayd (Australian rock musician) and Suzuki (media manager). Anti-Pop Rock and Roll. Message: Real music. Real people. Real lives. No waiting for permission. Write TikTok script: Hook first 3 seconds. Story arc 30-45 seconds. Ending call to action. 3-5 hashtags. Rock vibe.')
open(f'content/drafts/tt-{today}.md', 'w').write(f'# TikTok Script\n\n{tt}')

fb = gen('STRAYD featuring Martin Strayd (Australian rock musician) and Suzuki (band manager). Anti-Pop Rock and Roll. Message: Real music. Real people. Real lives. No waiting for permission. Write Facebook post. Story-driven. 2-4 sentences. Include emoji. Call to action. Rock energy.')
open(f'content/drafts/fb-{today}.md', 'w').write(f'# Facebook Post\n\n{fb}')

yt = gen('STRAYD featuring Martin Strayd and Suzuki. Anti-Pop Rock and Roll. Message: Real music. Real people. Real lives. No waiting for permission. Write YouTube description: Hook first 150 characters, main description 2-3 paragraphs, timestamps placeholder, links section, 10 SEO tags. End with: real music. real people. real stories.')
open(f'content/drafts/yt-{today}.md', 'w').write(f'# YouTube Description\n\n{yt}')

print('Files created:')
for f in os.listdir('content/drafts'):
    print(f'  {f}')
"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/drafts/
          git commit -m "Daily social content $(date +%Y-%m-%d)"
          git push origin main
