name: Daily Social Posts

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: suzukistrayd/ai-head-office

      - name: Load knowledge
        run: |
          cat knowledge/brand/strayd.md > /tmp/knowledge.txt
          cat characters/suzuki/-index.md >> /tmp/knowledge.txt
          cat characters/martin-strayd/-index.md >> /tmp/knowledge.txt
          echo "Knowledge loaded: $(wc -c < /tmp/knowledge.txt) chars"

      - name: Generate X post
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          curl -s -X POST https://inference.dahl.global/v1/chat/completions \
            -H "Authorization: Bearer $DAHL_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"MiniMaxAI/MiniMax-M2.7\",\"messages\":[{\"role\":\"system\",\"content\":\"You are a social media manager. Only use facts provided. Do not make up information.\"},{\"role\":\"user\",\"content\":\"Knowledge: $(cat /tmp/knowledge.txt). Write 1 X post. Under 280 chars. Rock vibe. 2-3 hashtags.\"}]}" \
            -o /tmp/x_response.json
          cat /tmp/x_response.json | python3 -c "import sys,json; print(json.load(sys.stdin)['choices'][0]['message']['content'])" > content/drafts/x-$(date +%Y-%m-%d).md

      - name: Generate IG
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          curl -s -X POST https://inference.dahl.global/v1/chat/completions \
            -H "Authorization: Bearer $DAHL_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"MiniMaxAI/MiniMax-M2.7\",\"messages\":[{\"role\":\"system\",\"content\":\"You are a social media manager. Only use facts provided.\"},{\"role\":\"user\",\"content\":\"Knowledge: $(cat /tmp/knowledge.txt). Write 1 Instagram caption. Hook first. 5 hashtags.\"}]}" \
            -o /tmp/ig_response.json
          cat /tmp/ig_response.json | python3 -c "import sys,json; print(json.load(sys.stdin)['choices'][0]['message']['content'])" > content/drafts/ig-$(date +%Y-%m-%d).md

      - name: Generate TikTok
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          curl -s -X POST https://inference.dahl.global/v1/chat/completions \
            -H "Authorization: Bearer $DAHL_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"MiniMaxAI/MiniMax-M2.7\",\"messages\":[{\"role\":\"system\",\"content\":\"You are a social media manager. Only use facts provided.\"},{\"role\":\"user\",\"content\":\"Knowledge: $(cat /tmp/knowledge.txt). Write TikTok script. Hook 3sec. Story. CTA.\"}]}" \
            -o /tmp/tt_response.json
          cat /tmp/tt_response.json | python3 -c "import sys,json; print(json.load(sys.stdin)['choices'][0]['message']['content'])" > content/drafts/tt-$(date +%Y-%m-%d).md

      - name: Generate Facebook
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          curl -s -X POST https://inference.dahl.global/v1/chat/completions \
            -H "Authorization: Bearer $DAHL_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"MiniMaxAI/MiniMax-M2.7\",\"messages\":[{\"role\":\"system\",\"content\":\"You are a social media manager. Only use facts provided.\"},{\"role\":\"user\",\"content\":\"Knowledge: $(cat /tmp/knowledge.txt). Write Facebook post. Story. Emoji. CTA.\"}]}" \
            -o /tmp/fb_response.json
          cat /tmp/fb_response.json | python3 -c "import sys,json; print(json.load(sys.stdin)['choices'][0]['message']['content'])" > content/drafts/fb-$(date +%Y-%m-%d).md

      - name: Show files
        run: |
          ls -la content/drafts/

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/drafts/
          git commit -m "Social content $(date +%Y-%m-%d)"
          git push origin main
