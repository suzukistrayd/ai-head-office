name: Daily Social Posts

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: suzukistrayd/ai-head-office

      - name: Generate social posts
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          pip install requests -q
          python3 -c "
import os, requests
from datetime import date

brand = open('knowledge/brand/strayd.md').read()
suzuki = open('characters/suzuki/-index.md').read()
martin = open('characters/martin-strayd/-index.md').read()
ctx = brand + suzuki + martin

api = os.environ['DAHL_API_KEY']
url = 'https://inference.dahl.global/v1/chat/completions'
h = {'Authorization': 'Bearer ' + api}

def g(m):
    return requests.post(url, json={'model': 'MiniMaxAI/MiniMax-M2.7', 'messages': [{'role': 'user', 'content': ctx + m}]}, headers=h, timeout=60).json()['choices'][0]['message']['content']

t = date.today().isoformat()
os.makedirs('content/drafts', exist_ok=True)

open(f'content/drafts/x-{t}.md', 'w').write('# X Post\n\n' + g('Write ONE X post. Under 280 chars. Rock. 2-3 hashtags. Output ONLY the post.'))
open(f'content/drafts/ig-{t}.md', 'w').write('# Instagram\n\n' + g('Write ONE Instagram caption. Hook first. 5 hashtags. Output ONLY.'))
open(f'content/drafts/tt-{t}.md', 'w').write('# TikTok\n\n' + g('Write TikTok script. Hook. Story. CTA. Output ONLY.'))
open(f'content/drafts/fb-{t}.md', 'w').write('# Facebook\n\n' + g('Write Facebook post. Story. Emoji. CTA. Output ONLY.'))
print('Done')
"

      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@strayd.com"
          git add -A
          git commit -m "Daily social $(date +%Y-%m-%d)"
          git push origin main
