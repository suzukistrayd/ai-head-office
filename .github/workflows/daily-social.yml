name: Daily Social Posts

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: suzukistrayd/ai-head-office

      - name: Generate social posts
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          pip install requests -q
          python3 << 'PYEOF'
import os, requests
from datetime import date

brand = open("knowledge/brand/strayd.md").read()
suzuki = open("characters/suzuki/-index.md").read()
martin = open("characters/martin-strayd/-index.md").read()
ctx = brand + "\n" + suzuki + "\n" + martin

api = os.environ["DAHL_API_KEY"]
url = "https://inference.dahl.global/v1/chat/completions"
h = {"Authorization": "Bearer " + api}

def gen(m):
    r = requests.post(url, json={"model": "MiniMaxAI/MiniMax-M2.7", "messages": [{"role": "user", "content": ctx + "\n\n" + m}]}, headers=h, timeout=60)
    return r.json()["choices"][0]["message"]["content"]

t = date.today().isoformat()
os.makedirs("content/drafts", exist_ok=True)

open(f"content/drafts/x-{t}.md", "w").write("# X Post\n\n" + gen("Write ONE X post. Under 280 chars. Rock. 2-3 hashtags. Output ONLY the post."))
open(f"content/drafts/ig-{t}.md", "w").write("# Instagram\n\n" + gen("Write ONE Instagram caption. Hook first. 5 hashtags. Output ONLY the caption."))
open(f"content/drafts/tt-{t}.md", "w").write("# TikTok\n\n" + gen("Write TikTok script. Hook. Story. CTA. Output ONLY the script."))
open(f"content/drafts/fb-{t}.md", "w").write("# Facebook\n\n" + gen("Write Facebook post. Story. Emoji. CTA. Output ONLY the post."))
print("Done")
PYEOF

      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@strayd.com"
          git add content/drafts/
          git commit -m "Daily social $(date +%Y-%m-%d)"
          git push origin main
