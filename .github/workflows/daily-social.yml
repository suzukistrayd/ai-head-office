name: Daily Social Posts

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: suzukistrayd/ai-head-office

      - name: Load knowledge
        run: |
          cat knowledge/brand/strayd.md > /tmp/brand.txt
          cat characters/suzuki/-index.md >> /tmp/brand.txt
          cat characters/martin-strayd/-index.md >> /tmp/brand.txt
          echo "Loaded"

      - name: Generate X
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          DATE=$(date +%Y-%m-%d)
          curl -s -X POST https://inference.dahl.global/v1/chat/completions \
            -H "Authorization: Bearer $DAHL_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"MiniMaxAI/MiniMax-M2.7\",\"messages\":[{\"role\":\"system\",\"content\":\"You are a social media manager. Output ONLY the post text. No explanations. No labels. No analysis. Just the post.\"},{\"role\":\"user\",\"content\":\"$(cat /tmp/brand.txt)\n\nWrite ONE X post. Rock vibe. Under 280 chars. 2-3 hashtags.\"}]}" \
            > /tmp/x_raw.txt
          # Extract just the text
          python3 -c "
import json
with open('/tmp/x_raw.txt') as f:
    data = json.load(f)
content = data['choices'][0]['message']['content'].strip()
with open('content/drafts/x-$DATE.md', 'w') as f:
    f.write('# X Post\n\n' + content)
print('X:', content[:80])
"

      - name: Generate IG
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          DATE=$(date +%Y-%m-%d)
          curl -s -X POST https://inference.dahl.global/v1/chat/completions \
            -H "Authorization: Bearer $DAHL_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"MiniMaxAI/MiniMax-M2.7\",\"messages\":[{\"role\":\"system\",\"content\":\"You are a social media manager. Output ONLY the caption text. No explanations. No labels. Just the caption.\"},{\"role\":\"user\",\"content\":\"$(cat /tmp/brand.txt)\n\nWrite ONE Instagram caption. Hook first. 5 hashtags.\"}]}" \
            > /tmp/ig_raw.txt
          python3 -c "
import json
with open('/tmp/ig_raw.txt') as f:
    data = json.load(f)
content = data['choices'][0]['message']['content'].strip()
with open('content/drafts/ig-$DATE.md', 'w') as f:
    f.write('# Instagram Caption\n\n' + content)
print('IG:', content[:80])
"

      - name: Generate TT
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          DATE=$(date +%Y-%m-%d)
          curl -s -X POST https://inference.dahl.global/v1/chat/completions \
            -H "Authorization: Bearer $DAHL_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"MiniMaxAI/MiniMax-M2.7\",\"messages\":[{\"role\":\"system\",\"content\":\"You are a social media manager. Output ONLY the script. No explanations. No labels. Just the script.\"},{\"role\":\"user\",\"content\":\"$(cat /tmp/brand.txt)\n\nWrite TikTok script. Hook 3sec. Story. CTA.\"}]}" \
            > /tmp/tt_raw.txt
          python3 -c "
import json
with open('/tmp/tt_raw.txt') as f:
    data = json.load(f)
content = data['choices'][0]['message']['content'].strip()
with open('content/drafts/tt-$DATE.md', 'w') as f:
    f.write('# TikTok Script\n\n' + content)
print('TT:', content[:80])
"

      - name: Generate FB
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          DATE=$(date +%Y-%m-%d)
          curl -s -X POST https://inference.dahl.global/v1/chat/completions \
            -H "Authorization: Bearer $DAHL_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"MiniMaxAI/MiniMax-M2.7\",\"messages\":[{\"role\":\"system\",\"content\":\"You are a social media manager. Output ONLY the post. No explanations. No labels. Just the post.\"},{\"role\":\"user\",\"content\":\"$(cat /tmp/brand.txt)\n\nWrite Facebook post. Story. Emoji. CTA.\"}]}" \
            > /tmp/fb_raw.txt
          python3 -c "
import json
with open('/tmp/fb_raw.txt') as f:
    data = json.load(f)
content = data['choices'][0]['message']['content'].strip()
with open('content/drafts/fb-$DATE.md', 'w') as f:
    f.write('# Facebook Post\n\n' + content)
print('FB:', content[:80])
"

      - name: Show results
        run: |
          echo "=== FILES CREATED ==="
          ls -la content/drafts/

      - name: Commit
        run: |
          git config user.name "Dahl Bot"
          git config user.email "bot@strayd.com"
          git add content/drafts/
          git commit -m "Daily social $(date +%Y-%m-%d)"
          git push origin main
