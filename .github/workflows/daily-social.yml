name: Daily Social Posts

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: suzukistrayd/ai-head-office

      - name: Create Python script
        run: |
          cat > generate.py << 'ENDSCRIPT'
import os, requests
from datetime import date

brand = open('knowledge/brand/strayd.md').read() if os.path.exists('knowledge/brand/strayd.md') else ""
suzuki = open('characters/suzuki/-index.md').read() if os.path.exists('characters/suzuki/-index.md') else ""
martin = open('characters/martin-strayd/-index.md').read() if os.path.exists('characters/martin-strayd/-index.md') else ""

TRUTH = "USE ONLY THIS INFORMATION:\n" + brand + "\n" + suzuki + "\n" + martin + "\nDo not add any information not in this text."

t = date.today().isoformat()
os.makedirs("content/drafts", exist_ok=True)

a = os.environ["DAHL_API_KEY"]
u = "https://inference.dahl.global/v1/chat/completions"
h = {"Authorization": "Bearer " + a, "Content-Type": "application/json"}

def gen(prompt):
    r = requests.post(u, json={"model": "MiniMaxAI/MiniMax-M2.7", "messages": [{"role": "user", "content": TRUTH + "\n\n" + prompt}]}, headers=h, timeout=60)
    return r.json()["choices"][0]["message"]["content"]

open(f"content/drafts/x-{t}.md", "w").write("# X Post\n\n" + gen("Write 1 X post. Under 280 chars. Rock vibe. 2-3 hashtags."))
open(f"content/drafts/ig-{t}.md", "w").write("# Instagram\n\n" + gen("Write IG caption. Hook first. 5 hashtags."))
open(f"content/drafts/tt-{t}.md", "w").write("# TikTok\n\n" + gen("TikTok script. Hook 3sec. Story arc. CTA."))
open(f"content/drafts/fb-{t}.md", "w").write("# Facebook\n\n" + gen("FB post. Story. Emoji. CTA."))

print("Done:", os.listdir("content/drafts"))
ENDSCRIPT

      - name: Run Python
        run: |
          pip install requests -q
          python3 generate.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/drafts/
          git commit -m "Social content $(date +%Y-%m-%d)"
          git push origin main
