name: Approve & Post

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform (x, ig, tt, fb)'
        required: true
      content_file:
        description: 'File path'
        required: true

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: suzukistrayd/ai-head-office

      - name: Approve content
        run: |
          mkdir -p content/approved/$(date +%Y-%m-%d)
          cp "${{ github.event.inputs.content_file }}" content/approved/$(date +%Y-%m-%d)/
          echo "Approved: ${{ github.event.inputs.platform }}"

      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@strayd.com"
          git add content/approved/
          git commit -m "Approved ${{ github.event.inputs.platform }}"
          git push origin main
