
name: Research Agent

on:
  schedule:
    - cron: '0 8 * * 0'  # Sunday 8am weekly
  workflow_dispatch:
    inputs:
      topic:
        description: 'Research topic'
        required: true
        default: 'free AI tools'

jobs:
  research-task:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Research
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
          TOPIC: ${{ inputs.topic || 'free AI tools for artists' }}
        run: |
          curl -s https://inference.dahl.global/v1/chat/completions \
            -H "Authorization: Bearer $DAHL_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"MiniMaxAI/MiniMax-M2.7\",
              \"messages\": [{\"role\": \"system\", \"content\": \"You are a research agent. Find free, open-source, no-paywall tools and services. Be specific with names, URLs, and limits.\"}, {\"role\": \"user\", \"content\": \"Research: $TOPIC. List top 5 options with name, URL, free tier limits, and why it fits STRAYD stack.\"}]
            }" | jq -r '.choices[0].message.content' > knowledge/research/$(date +%Y-%m-%d)-$TOPIC.md
      
      - name: Update findings index
        run: |
          echo "- $(date +%Y-%m-%d): ${{ inputs.topic || 'free AI tools' }}" >> knowledge/research/index.md
          git config user.name "Dahl Research Agent"
          git config user.email "research@strayd.com"
          git add knowledge/research/
          git commit -m "Research: ${{ inputs.topic }}"
          git push
