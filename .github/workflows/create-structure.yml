name: Create Folder Structure

on:
  workflow_dispatch:

jobs:
  create-structure:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: suzukistrayd/ai-head-office
      
      - name: Create INPUT folder
        run: |
          mkdir -p INPUT/templates
          printf '# INPUT\nDump files here\n' > INPUT/README.md
          printf '# INTAKE AGENT\n' > INPUT/INTAKE-Agent.md
          printf '# Inbox\nUnsorted notes\n' > INPUT/inbox.md
          printf '# Random Note\n' > INPUT/templates/random-note.md
          printf '# Story Fragment\n' > INPUT/templates/story-fragment.md
          printf '# Idea Dump\n' > INPUT/templates/idea-dump.md
          echo "INPUT done"

      - name: Create characters folders
        run: |
          mkdir -p characters/suzuki/headshots
          mkdir -p characters/martin-strayd/headshots
          printf '# SUZUKI\nMedia Manager\n' > characters/suzuki/-index.md
          printf '# Bio\n' > characters/suzuki/bio.md
          printf '# Visual Rules\n' > characters/suzuki/visual-rules.md
          printf '# Wardrobe\n' > characters/suzuki/wardrobe.md
          printf '# Story\n' > characters/suzuki/story.md
          printf '# Voice\n' > characters/suzuki/voice.md
          printf '# Headshots\n' > characters/suzuki/headshots/-placeholders.md
          printf '# MARTIN STRAYD\nRock Musician\n' > characters/martin-strayd/-index.md
          printf '# Bio\n' > characters/martin-strayd/bio.md
          printf '# Story\n' > characters/martin-strayd/story.md
          printf '# Voice\n' > characters/martin-strayd/voice.md
          printf '# Headshots\n' > characters/martin-strayd/headshots/-placeholders.md
          echo "Characters done"

      - name: Create mascot-maker
        run: |
          mkdir -p mascot-maker/approved-mascots
          printf '# Mascot Prompt Builder\n' > mascot-maker/mascot-prompt-builder.md
          printf '# Mascot Ideas\n' > mascot-maker/mascot-ideas.md
          printf '# Approved Mascots\n' > mascot-maker/approved-mascots/README.md
          echo "Mascot done"

      - name: Create strayd-stories
        run: |
          printf '# STRAYD Stories\n' > strayd-stories/approved-stories.md
          echo "Stories done"

      - name: Create promotion-studio
        run: |
          mkdir -p promotion-studio/headshots/results
          mkdir -p promotion-studio/ecommerce/mockups
          mkdir -p promotion-studio/editorial-posters/templates
          printf '# Headshots Workflow\n' > promotion-studio/headshots/workflow.md
          printf '# Results\n' > promotion-studio/headshots/results/README.md
          printf '# E-commerce Workflow\n' > promotion-studio/ecommerce/merch-workflow.md
          printf '# Mockups\n' > promotion-studio/ecommerce/mockups/README.md
          printf '# Poster Workflow\n' > promotion-studio/editorial-posters/poster-workflow.md
          printf '# Templates\n' > promotion-studio/editorial-posters/templates/README.md
          echo "Promotion studio done"

      - name: Create knowledge
        run: |
          mkdir -p knowledge/brand
          mkdir -p knowledge/platforms
          mkdir -p knowledge/workflows
          printf '# STRAYD Brand\n' > knowledge/brand/strayd.md
          printf '# Generation Rules\n' > knowledge/brand/generation-rules.md
          printf '# Social Priority\n' > knowledge/platforms/social-priority.md
          printf '# Content Pipeline\n' > knowledge/workflows/content-pipeline.md
          printf '# Triggers\n' > knowledge/workflows/triggers.md
          echo "Knowledge done"

      - name: Create OUTPUT
        run: |
          mkdir -p OUTPUT/social-posts
          mkdir -p OUTPUT/images
          mkdir -p OUTPUT/captions
          printf '# Social Posts\n' > OUTPUT/social-posts/README.md
          printf '# Images\n' > OUTPUT/images/README.md
          printf '# Captions\n' > OUTPUT/captions/README.md
          echo "OUTPUT done"

      - name: Create archive
        run: |
          mkdir -p archive/processed
          mkdir -p archive/rejected
          printf '# Processed\n' > archive/processed/README.md
          printf '# Rejected\n' > archive/rejected/README.md
          echo "Archive done"

      - name: Show structure
        run: |
          echo "=== ALL FILES ==="
          find . -type f | grep -v ".git" | sort

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git status
          git commit -m "Create full folder structure"
          git push
