name: STRAYD Social Media Content Director

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write

concurrency:
  group: strayd-social-agent-${{ github.ref }}
  cancel-in-progress: false

env:
  DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
  DAHL_API_URL: https://inference.dahl.global/v1/chat/completions
  DAHL_MODEL: MiniMaxAI/MiniMax-M2.7
  PYTHONUNBUFFERED: "1"

jobs:
  generate-social-content:
    name: Generate and Validate STRAYD Social Content
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required tools and knowledge files
        shell: bash
        run: |
          set -euo pipefail

          command -v python3 >/dev/null || {
            echo "::error::Python 3 is required."
            exit 1
          }

          test -n "${DAHL_API_KEY:-}" || {
            echo "::error::DAHL_API_KEY secret is missing."
            exit 1
          }

          for file in \
            brand-profile.md \
            characters/martinstrayd.md \
            characters/suzuki.md \
            songarchive.md \
            social-manager-prompt.md
          do
            if [ ! -s "$file" ]; then
              echo "::error::Required knowledge file is missing or empty: $file"
              exit 1
            fi
            echo "Verified knowledge file: $file"
          done

          mkdir -p social-posts/weekly social-posts/daily

      - name: Generate, validate and save weekly and daily content
        shell: bash
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import datetime
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          API_URL = os.environ["DAHL_API_URL"]
          API_KEY = os.environ["DAHL_API_KEY"]
          MODEL = os.environ["DAHL_MODEL"]
          RUN_NUMBER = os.environ.get("GITHUB_RUN_NUMBER", "1")

          ATTEMPTS = 5
          RETRY_DELAYS = [5, 10, 20, 30, 45]
          RETRY_CODES = {408, 409, 425, 429, 500, 502, 503, 504}

          KNOWLEDGE_FILES = [
              ("characters/martinstrayd.md", "MARTIN STRAYD — PRIORITY 1"),
              ("characters/suzuki.md", "SUZUKI — PRIORITY 2"),
              ("songarchive.md", "SONG ARCHIVE — PRIORITY 3"),
              ("brand-profile.md", "BRAND PROFILE — PRIORITY 4"),
              ("social-manager-prompt.md", "SOCIAL MANAGER PROMPT — REFERENCE"),
          ]

          DAYS = [
              "Monday", "Tuesday", "Wednesday", "Thursday",
              "Friday", "Saturday", "Sunday"
          ]

          SECTIONS = [
              "X",
              "Facebook",
              "YouTube Community",
              "TikTok",
              "Instagram",
              "Image Prompt",
              "Short Video Idea",
          ]

          PILLARS = [
              "Weekly Song Journey",
              "Rock & Roll Fantasy",
              "Creativity After 55",
              "Why Make Music",
              "How To Rock",
              "How To Write A Hit Song",
              "Creative Persistence",
              "Suzuki & Strayd",
              "Daily Creativity",
              "Entrepreneur Journey",
              "Archive Discoveries",
              "Rock History",
          ]

          PLATFORM_HASHTAGS = {
              "X": [
                  "#STRAYD", "#MartinStrayd", "#RockMusic",
                  "#Suzuki", "#Antipop", "#RockGuitar",
                  "#NewMusic", "#MusicLife", "#Backstage",
                  "#RockRoll", "#Straya", "#MusicianLife"
              ],
              "Facebook": [
                  "#STRAYD", "#MartinStrayd", "#RockMusic",
                  "#Suzuki", "#MusicProducer", "#Antipop",
                  "#NewMusic", "#MusicLife", "#GuitarLife",
                  "#RockAndRoll", "#IndieMusic", "#MusicianLife"
              ],
              "YouTube Community": [
                  "#STRAYD", "#MartinStrayd", "#RockMusic",
                  "#NewMusicFriday", "#Suzuki"
              ],
              "TikTok": [
                  "#STRAYD", "#martinstrayd", "#rockmusic",
                  "#straya", "#musicianlife", "#suzuki",
                  "#newmusic", "#antipop", "#fyp", "#viral",
                  "#australian", "#musicproducer"
              ],
              "Instagram": [
                  "#STRAYD", "#MartinStrayd", "#RockMusic",
                  "#Antipop", "#MusicProducer", "#RockGuitar",
                  "#NewMusic", "#MusicLife", "#GuitarLife",
                  "#RockAndRoll", "#IndieMusic", "#MusicianLife",
                  "#StudioLife", "#GuitarPlayer", "#MusicIsLife"
              ],
          }

          def log(message):
              print(message, flush=True)

          def fail(message):
              print(f"::error::{message}", flush=True)
              sys.exit(1)

          def read_knowledge():
              parts = []
              for filename, label in KNOWLEDGE_FILES:
                  path = Path(filename)
                  if not path.is_file():
                      fail(f"Knowledge file not found: {filename}")
                  content = path.read_text(encoding="utf-8").strip()
                  if not content:
                      fail(f"Knowledge file is empty: {filename}")
                  parts.append(
                      f"\n\n===== BEGIN {label} [{filename}] =====\n"
                      f"{content}\n"
                      f"===== END {label} [{filename}] =====\n"
                  )
                  log(f"Loaded knowledge: {filename} ({len(content)} characters)")
              return "\n".join(parts)

          def current_week():
              today = datetime.datetime.now(datetime.timezone.utc).date()
              monday = today - datetime.timedelta(days=today.weekday())
              return [
                  monday + datetime.timedelta(days=i)
                  for i in range(7)
              ]

          def normalize_dashes(content):
              replacements = {
                  '\u2014': '-',
                  '\u2013': '-',
                  '\u2212': '-',
                  '\u2018': "'",
                  '\u2019': "'",
                  '\u201c': '"',
                  '\u201d': '"',
                  '\u2026': '...',
              }
              result = content
              for old, new in replacements.items():
                  result = result.replace(old, new)
              return result

          def build_prompt(knowledge, week_dates):
              date_lines = "\n".join(
                  f"{day}: {date.isoformat()}"
                  for day, date in zip(DAYS, week_dates)
              )
              section_lines = "\n".join(f"### {s}" for s in SECTIONS)

              hashtag_ref = []
              for platform, tags in PLATFORM_HASHTAGS.items():
                  hashtag_ref.append(f"\n{platform}:")
                  hashtag_ref.append("  " + " ".join(tags))
              hashtag_reference = "\n".join(hashtag_ref)

              return f"""
          You are the STRAYD Content Director. You MUST output Markdown content only.
          Do NOT include any internal thoughts, reasoning steps, planning, introduction, preamble, commentary, or summary.
          Do NOT write phrases like "Let me carefully analyze..." or "Looking at the song archive...".
          Start IMMEDIATELY with the first heading: ## Monday - {week_dates[0].isoformat()}
          Do NOT wrap your response in markdown code blocks (```markdown ... ```).

          Generate content for all 7 days in exact order:
          {date_lines}

          STRICT DAY HEADER FORMAT:
          You MUST start each day with this EXACT heading format:
          ## DayName - YYYY-MM-DD

          Example:
          ## Monday - {week_dates[0].isoformat()}

          Within EVERY day, include these 7 level-3 headings in this exact order:
          {section_lines}

          STRICT PLATFORM HASHTAG COUNT RULES (Optimum Limits):
          You must pick and include hashtags from the reference list below according to these exact quantities per platform:
          - X: Include exactly 2 to 4 hashtags maximum.
          - Facebook: Include exactly 3 to 5 hashtags maximum.
          - YouTube Community: Include exactly 2 to 3 hashtags maximum.
          - TikTok: Include exactly 3 to 5 hashtags maximum.
          - Instagram: Include exactly 5 to 10 hashtags maximum.
          Do NOT dump every hashtag from the list into every platform. Select only the most relevant subset matching these exact limits.

          FACTUAL RULES:
          - Never invent songs, song titles, releases, release dates or credits.
          - Never invent biography, personal history or achievements.
          - Use only facts supported by the knowledge files below.
          - NEVER use em dashes. Use plain hyphens only: -
          - NEVER use smart quotes. Use plain quotes only: ' and "

          PLATFORM HASHTAG REFERENCE:
          {hashtag_reference}

          SUPPLIED KNOWLEDGE FILES:
          {knowledge}
          """.strip()

          def call_dahl(prompt):
              payload = {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "system",
                          "content": (
                              "You are the STRAYD Content Director. "
                              "Return only raw production Markdown starting directly with the first day header. "
                              "Do NOT write any thinking process, internal monologue, preamble, or commentary."
                          ),
                      },
                      {"role": "user", "content": prompt},
                  ],
                  "temperature": 0.7,
                  "max_tokens": 5000,
              }

              request_data = json.dumps(payload).encode("utf-8")

              for attempt in range(1, ATTEMPTS + 1):
                  request = urllib.request.Request(
                      API_URL,
                      data=request_data,
                      headers={
                          "Authorization": f"Bearer {API_KEY}",
                          "Content-Type": "application/json",
                          "Accept": "application/json",
                      },
                      method="POST",
                  )

                  try:
                      log(f"API Request attempt {attempt}/{ATTEMPTS}...")
                      with urllib.request.urlopen(request, timeout=240) as response:
                          raw = response.read().decode("utf-8")
                          data = json.loads(raw)

                      choices = data.get("choices") or []
                      if not choices:
                          raise ValueError("DAHL response contains no choices.")

                      content = choices[0].get("message", {}).get("content")
                      if not isinstance(content, str) or not content.strip():
                          raise ValueError("DAHL returned empty content.")

                      return content.strip()

                  except urllib.error.HTTPError as exc:
                      code = exc.code
                      try:
                          body = exc.read().decode("utf-8", errors="replace")
                      except Exception:
                          body = ""

                      log(f"DAHL HTTP error {code}: {body[:300]}")
                      if code not in RETRY_CODES:
                          fail(f"Non-retryable HTTP error {code}.")

                      if attempt == ATTEMPTS:
                          fail(f"HTTP {code} persisted after {ATTEMPTS} attempts.")

                  except (urllib.error.URLError, TimeoutError, json.JSONDecodeError, ValueError) as exc:
                      log(f"DAHL connection error: {type(exc).__name__}: {exc}")
                      if attempt == ATTEMPTS:
                          fail(f"Request failed after {ATTEMPTS} attempts.")

                  delay = RETRY_DELAYS[attempt - 1]
                  log(f"Retrying in {delay} seconds...")
                  time.sleep(delay)

              fail("DAHL request ended unexpectedly.")

          def parse_and_validate(markdown, week_dates):
              if not markdown.strip():
                  fail("Generated Markdown is empty.")

              markdown = re.sub(r"^```markdown\s*", "", markdown, flags=re.MULTILINE)
              markdown = re.sub(r"^```\s*$", "", markdown, flags=re.MULTILINE)

              day_pattern = re.compile(
                  r"^##\s+(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)\s*[:—\u2014\-]\s*(\d{4}-\d{2}-\d{2})\s*$",
                  re.MULTILINE | re.IGNORECASE
              )

              matches = list(day_pattern.finditer(markdown))

              if len(matches) != 7:
                  fail(
                      f"Validation failed: expected exactly 7 day headers; "
                      f"found {len(matches)}."
                  )

              sections_by_day = {}

              for index, match in enumerate(matches):
                  actual_day = match.group(1).capitalize()
                  expected_day = DAYS[index]
                  expected_date = week_dates[index].isoformat()

                  if actual_day != expected_day:
                      fail(f"Days out of order: expected {expected_day}, found {actual_day}.")

                  start = match.start()
                  end = matches[index + 1].start() if index + 1 < len(matches) else len(markdown)
                  section = markdown[start:end].strip()

                  sections_by_day[actual_day] = section

                  log(f"Validated {actual_day} ({expected_date})")

              return sections_by_day

          def safe_write(path, content):
              path = Path(path)
              path.parent.mkdir(parents=True, exist_ok=True)

              target = path
              counter = 1

              while target.exists():
                  target = path.with_name(
                      f"{path.stem}-run-{RUN_NUMBER}"
                      f"{'' if counter == 1 else '-' + str(counter)}"
                      f"{path.suffix}"
                  )
                  counter += 1

              normalized = normalize_dashes(content.rstrip()) + "\n"

              with target.open("x", encoding="utf-8", newline="\n") as handle:
                  handle.write(normalized)

              log(f"Created {target}")
              return target

          def main():
              week_dates = current_week()
              knowledge = read_knowledge()
              prompt = build_prompt(knowledge, week_dates)

              log(f"Generating content for week beginning {week_dates[0]}.")
              markdown = call_dahl(prompt)

              daily_sections = parse_and_validate(markdown, week_dates)

              # Assemble pure weekly file strictly from validated daily sections (stripping model thoughts)
              clean_weekly_content = "\n\n".join(daily_sections[day] for day in DAYS)

              weekly_path = Path(
                  "social-posts/weekly/"
                  f"{week_dates[0].isoformat()}-calendar.md"
              )

              weekly_saved = safe_write(weekly_path, clean_weekly_content)

              created_daily = []

              for day, date in zip(DAYS, week_dates):
                  slug = day.lower()
                  daily_path = Path(
                      "social-posts/daily/"
                      f"{date.isoformat()}-{slug}.md"
                  )

                  daily_content = (
                      f"# STRAYD Social Content - {day}, "
                      f"{date.isoformat()}\n\n"
                      f"Source calendar: {weekly_saved.as_posix()}\n\n"
                      f"{daily_sections[day]}"
                  )

                  created_daily.append(
                      safe_write(daily_path, daily_content)
                  )

              readme = Path("social-posts/README.md")

              if not readme.exists():
                  readme.write_text(
                      "# STRAYD Social Content\n\n"
                      "- `weekly/` contains complete weekly calendars.\n"
                      "- `daily/` contains one Markdown file per day.\n\n"
                      "Generated by `.github/workflows/social-agent.yml`.\n",
                      encoding="utf-8",
                  )
                  log("Created social-posts/README.md")

              log("")
              log("SUCCESS: WEEKLY AND DAILY CONTENT GENERATED AND VALIDATED SUCCESSFULLY")

          if __name__ == "__main__":
              main()
          PY

      - name: Commit generated social content
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add social-posts/

          if git diff --cached --quiet; then
            echo "No new social content changes to commit."
            exit 0
          fi

          git commit -m "Generate STRAYD weekly and daily social content"

          git push

          echo "Social content committed successfully."
