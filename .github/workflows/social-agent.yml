name: STRAYD Social Media Content Director

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write

concurrency:
  group: strayd-social-agent-${{ github.ref }}
  cancel-in-progress: false

env:
  DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
  DAHL_API_URL: https://inference.dahl.global/v1/chat/completions
  DAHL_MODEL: MiniMaxAI/MiniMax-M2.7
  PYTHONUNBUFFERED: "1"

jobs:
  generate-social-content:
    name: Generate and Validate STRAYD Social Content
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required tools and knowledge files
        shell: bash
        run: |
          set -euo pipefail

          command -v python3 >/dev/null || {
            echo "::error::Python 3 is required."
            exit 1
          }

          test -n "${DAHL_API_KEY:-}" || {
            echo "::error::DAHL_API_KEY secret is missing."
            exit 1
          }

          for file in \
            brand-profile.md \
            characters/martinstrayd.md \
            characters/suzuki.md \
            songarchive.md \
            social-manager-prompt.md
          do
            if [ ! -s "$file" ]; then
              echo "::error::Required knowledge file is missing or empty: $file"
              exit 1
            fi
            echo "Verified knowledge file: $file"
          done

          mkdir -p social-posts/weekly social-posts/daily

      - name: Generate, validate and save weekly and daily content
        shell: bash
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import datetime
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          API_URL = os.environ["DAHL_API_URL"]
          API_KEY = os.environ["DAHL_API_KEY"]
          MODEL = os.environ["DAHL_MODEL"]
          RUN_NUMBER = os.environ.get("GITHUB_RUN_NUMBER", "1")

          ATTEMPTS = 5
          RETRY_DELAYS = [5, 10, 20, 30, 45]
          RETRY_CODES = {408, 409, 425, 429, 500, 502, 503, 504}

          KNOWLEDGE_FILES = [
              ("characters/martinstrayd.md", "MARTIN STRAYD"),
              ("characters/suzuki.md", "SUZUKI"),
              ("songarchive.md", "SONG ARCHIVE"),
              ("brand-profile.md", "BRAND PROFILE"),
          ]

          DAYS = [
              "Monday", "Tuesday", "Wednesday", "Thursday",
              "Friday", "Saturday", "Sunday"
          ]

          SECTIONS = [
              "X",
              "Facebook",
              "YouTube Community",
              "TikTok",
              "Instagram",
              "Image Prompt",
              "Short Video Idea",
          ]

          PILLARS = [
              "Weekly Song Journey",
              "Rock & Roll Fantasy",
              "Creativity After 55",
              "Why Make Music",
              "How To Rock",
              "How To Write A Hit Song",
              "Creative Persistence",
              "Suzuki & Strayd",
              "Daily Creativity",
              "Entrepreneur Journey",
              "Archive Discoveries",
              "Rock History",
          ]

          PLATFORM_HASHTAGS = {
              "X": ["#STRAYD", "#MartinStrayd", "#RockMusic", "#Suzuki", "#Antipop", "#RockGuitar", "#NewMusic", "#MusicLife", "#Backstage", "#RockRoll", "#Straya", "#MusicianLife"],
              "Facebook": ["STRAYD", "Martin Strayd", "Rock Music", "Suzuki", "Music Producer", "Antipop", "New Music", "Music Life", "Guitar Life", "Rock And Roll", "Indie Music", "Musician Life"],
              "YouTube Community": ["#STRAYD", "#MartinStrayd", "#RockMusic", "#NewMusicFriday", "#Suzuki"],
              "TikTok": ["#STRAYD", "#martinstrayd", "#rockmusic", "#straya", "#musicianlife", "#suzuki", "#newmusic", "#antipop", "#fyp", "#viral", "#australian", "#musicproducer"],
              "Instagram": ["#STRAYD", "#MartinStrayd", "#RockMusic", "#Antipop", "#MusicProducer", "#RockGuitar", "#NewMusic", "#MusicLife", "#GuitarLife", "#RockAndRoll", "#IndieMusic", "#MusicianLife", "#StudioLife", "#GuitarPlayer", "#MusicIsLife"],
          }

          def log(message):
              print(message, flush=True)

          def fail(message):
              print(f"::error::{message}", flush=True)
              sys.exit(1)

          def read_knowledge():
              parts = []
              for filename, label in KNOWLEDGE_FILES:
                  path = Path(filename)
                  if not path.is_file():
                      fail(f"Knowledge file not found: {filename}")
                  content = path.read_text(encoding="utf-8").strip()
                  # Truncate overly massive blocks to ensure prompt fits comfortably within token limits
                  if len(content) > 12000:
                      content = content[:12000] + "\n[Content truncated for length]"
                  parts.append(f"=== {label} ===\n{content}\n")
              return "\n".join(parts)

          def current_week():
              today = datetime.datetime.now(datetime.timezone.utc).date()
              monday = today - datetime.timedelta(days=today.weekday())
              return [monday + datetime.timedelta(days=i) for i in range(7)]

          def normalize_dashes(content):
              replacements = {
                  '\u2014': '-', '\u2013': '-', '\u2212': '-',
                  '\u2018': "'", '\u2019': "'", '\u201c': '"', '\u201d': '"', '\u2026': '...'
              }
              result = content
              for old, new in replacements.items():
                  result = result.replace(old, new)
              return result

          def build_prompt(knowledge, week_dates):
              date_lines = "\n".join(f"{day}: {date.isoformat()}" for day, date in zip(DAYS, week_dates))
              section_lines = "\n".join(f"### {s}" for s in SECTIONS)
              
              return f"""
          You are the STRAYD Content Director.
          Generate a complete weekly social content calendar for all seven days in order:
          {date_lines}

          Factual rules: Use only facts from the supplied knowledge. No em dashes (- only). No smart quotes.
          
          Every day must start with:
          ## DayName — YYYY-MM-DD
          
          Followed by these 7 exact headings:
          {section_lines}

          SUPPLIED KNOWLEDGE:
          {knowledge}
          """.strip()

          def call_dahl(prompt):
              payload = {
                  "model": MODEL,
                  "messages": [
                      {"role": "system", "content": "You are the STRAYD Content Director. Return valid markdown only."},
                      {"role": "user", "content": prompt},
                  ],
                  "temperature": 0.7,
                  "max_tokens": 4000,
              }

              request_data = json.dumps(payload).encode("utf-8")

              for attempt in range(1, ATTEMPTS + 1):
                  request = urllib.request.Request(
                      API_URL,
                      data=request_data,
                      headers={
                          "Authorization": f"Bearer {API_KEY}",
                          "Content-Type": "application/json",
                          "Accept": "application/json",
                      },
                      method="POST",
                  )

                  try:
                      log(f"API Request attempt {attempt}/{ATTEMPTS}...")
                      with urllib.request.urlopen(request, timeout=180) as response:
                          raw = response.read().decode("utf-8")
                          data = json.loads(raw)

                      choices = data.get("choices") or []
                      if not choices:
                          raise ValueError("No choices returned.")

                      content = choices[0].get("message", {}).get("content")
                      if not isinstance(content, str) or not content.strip():
                          raise ValueError("Empty content returned.")

                      return content.strip()

                  except Exception as exc:
                      log(f"Attempt {attempt} failed: {exc}")
                      if attempt == ATTEMPTS:
                          fail("All API attempts failed.")
                      time.sleep(RETRY_DELAYS[attempt - 1])

          def parse_and_validate(markdown, week_dates):
              if not markdown.strip():
                  fail("Markdown output is empty.")

              day_pattern = re.compile(
                  r"^##\s+(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)\s+[—\u2014\-]\s+(\d{4}-\d{2}-\d{2})\s*$",
                  re.MULTILINE,
              )
              matches = list(day_pattern.finditer(markdown))
              if len(matches) != 7:
                  fail(f"Expected 7 day headers, found {len(matches)}.")

              sections_by_day = {}
              for index, match in enumerate(matches):
                  actual_day = match.group(1)
                  start = match.start()
                  end = matches[index + 1].start() if index + 1 < len(matches) else len(markdown)
                  sections_by_day[actual_day] = markdown[start:end].strip()

              return sections_by_day

          def safe_write(path, content):
              path = Path(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              target = path
              counter = 1
              while target.exists():
                  target = path.with_name(f"{path.stem}-run-{RUN_NUMBER}-{counter}{path.suffix}")
                  counter += 1

              normalized = normalize_dashes(content.rstrip()) + "\n"
              with target.open("x", encoding="utf-8", newline="\n") as handle:
                  handle.write(normalized)
              log(f"Created {target}")
              return target

          def main():
              week_dates = current_week()
              knowledge = read_knowledge()
              prompt = build_prompt(knowledge, week_dates)

              log("Generating optimized calendar...")
              markdown = call_dahl(prompt)
              daily_sections = parse_and_validate(markdown, week_dates)

              weekly_path = Path(f"social-posts/weekly/{week_dates[0].isoformat()}-calendar.md")
              weekly_saved = safe_write(weekly_path, markdown)

              for day, date in zip(DAYS, week_dates):
                  daily_path = Path(f"social-posts/daily/{date.isoformat()}-{day.lower()}.md")
                  daily_content = f"# STRAYD Social Content - {day}, {date.isoformat()}\n\nSource: {weekly_saved.as_posix()}\n\n{daily_sections.get(day, '')}"
                  safe_write(daily_path, daily_content)

              readme = Path("social-posts/README.md")
              if not readme.exists():
                  readme.write_text("# STRAYD Social Content\n", encoding="utf-8")

              log("SUCCESS: CONTENT GENERATED AND SAVED")

          if __name__ == "__main__":
              main()
          PY

      - name: Commit generated social content
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-posts/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Generate STRAYD social content"
          git push
          echo "Committed successfully."
