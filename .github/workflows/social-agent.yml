name: STRAYD Social Media Content Director

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write

concurrency:
  group: strayd-social-agent-${{ github.ref }}
  cancel-in-progress: false

env:
  DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
  DAHL_API_URL: https://inference.dahl.global/v1/chat/completions
  DAHL_MODEL: MiniMaxAI/MiniMax-M2.7
  PYTHONUNBUFFERED: "1"

jobs:
  generate-social-content:
    name: Generate and Validate STRAYD Social Content
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required tools and knowledge files
        shell: bash
        run: |
          set -euo pipefail

          command -v python3 >/dev/null || {
            echo "::error::Python 3 is required."
            exit 1
          }

          test -n "${DAHL_API_KEY:-}" || {
            echo "::error::DAHL_API_KEY secret is missing."
            exit 1
          }

          for file in \
            brand-profile.md \
            characters/martinstrayd.md \
            characters/suzuki.md \
            songarchive.md \
            social-manager-prompt.md
          do
            if [ ! -s "$file" ]; then
              echo "::error::Required knowledge file is missing or empty: $file"
              exit 1
            fi
            echo "Verified knowledge file: $file"
          done

          mkdir -p social-posts/weekly social-posts/daily

      - name: Generate, validate and save weekly and daily content
        shell: bash
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import datetime
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          API_URL = os.environ["DAHL_API_URL"]
          API_KEY = os.environ["DAHL_API_KEY"]
          MODEL = os.environ["DAHL_MODEL"]
          RUN_NUMBER = os.environ.get("GITHUB_RUN_NUMBER", "1")

          ATTEMPTS = 6
          RETRY_DELAYS = [5, 10, 20, 40, 60, 60]
          RETRY_CODES = {408, 409, 425, 429, 500, 502, 503, 504}

          KNOWLEDGE_FILES = [
              ("characters/martinstrayd.md", "MARTIN STRAYD — PRIORITY 1"),
              ("characters/suzuki.md", "SUZUKI — PRIORITY 2"),
              ("songarchive.md", "SONG ARCHIVE — PRIORITY 3"),
              ("brand-profile.md", "BRAND PROFILE — PRIORITY 4"),
              ("social-manager-prompt.md", "SOCIAL MANAGER PROMPT — REFERENCE"),
          ]

          DAYS = [
              "Monday", "Tuesday", "Wednesday", "Thursday",
              "Friday", "Saturday", "Sunday"
          ]

          SECTIONS = [
              "X",
              "Facebook",
              "YouTube Community",
              "TikTok",
              "Instagram",
              "Image Prompt",
              "Short Video Idea",
          ]

          PILLARS = [
              "Weekly Song Journey",
              "Rock & Roll Fantasy",
              "Creativity After 55",
              "Why Make Music",
              "How To Rock",
              "How To Write A Hit Song",
              "Creative Persistence",
              "Suzuki & Strayd",
              "Daily Creativity",
              "Entrepreneur Journey",
              "Archive Discoveries",
              "Rock History",
          ]

          PLATFORM_HASHTAGS = {
              "X": [
                  "#STRAYD", "#MartinStrayd", "#RockMusic",
                  "#Suzuki", "#Antipop", "#RockGuitar",
                  "#NewMusic", "#MusicLife", "#Backstage",
                  "#RockRoll", "#Straya", "#MusicianLife"
              ],
              "Facebook": [
                  "STRAYD", "Martin Strayd", "Rock Music",
                  "Suzuki", "Music Producer", "Antipop",
                  "New Music", "Music Life", "Guitar Life",
                  "Rock And Roll", "Indie Music", "Musician Life"
              ],
              "YouTube Community": [
                  "#STRAYD", "#MartinStrayd", "#RockMusic",
                  "#NewMusicFriday", "#Suzuki"
              ],
              "TikTok": [
                  "#STRAYD", "#martinstrayd", "#rockmusic",
                  "#straya", "#musicianlife", "#suzuki",
                  "#newmusic", "#antipop", "#fyp", "#viral",
                  "#australian", "#musicproducer"
              ],
              "Instagram": [
                  "#STRAYD", "#MartinStrayd", "#RockMusic",
                  "#Antipop", "#MusicProducer", "#RockGuitar",
                  "#NewMusic", "#MusicLife", "#GuitarLife",
                  "#RockAndRoll", "#IndieMusic", "#MusicianLife",
                  "#StudioLife", "#GuitarPlayer", "#MusicIsLife"
              ],
          }

          def log(message):
              print(message, flush=True)

          def fail(message):
              print(f"::error::{message}", flush=True)
              sys.exit(1)

          def read_knowledge():
              parts = []
              for filename, label in KNOWLEDGE_FILES:
                  path = Path(filename)
                  if not path.is_file():
                      fail(f"Knowledge file not found: {filename}")
                  content = path.read_text(encoding="utf-8").strip()
                  if not content:
                      fail(f"Knowledge file is empty: {filename}")
                  parts.append(
                      f"\n\n===== BEGIN {label} [{filename}] =====\n"
                      f"{content}\n"
                      f"===== END {label} [{filename}] =====\n"
                  )
                  log(f"Loaded knowledge: {filename} ({len(content)} characters)")
              return "\n".join(parts)

          def current_week():
              today = datetime.datetime.now(datetime.timezone.utc).date()
              monday = today - datetime.timedelta(days=today.weekday())
              return [
                  monday + datetime.timedelta(days=i)
                  for i in range(7)
              ]

          def normalize_dashes(content):
              replacements = {
                  '\u2014': '-',
                  '\u2013': '-',
                  '\u2212': '-',
                  '\u2018': "'",
                  '\u2019': "'",
                  '\u201c': '"',
                  '\u201d': '"',
                  '\u2026': '...',
              }
              result = content
              for old, new in replacements.items():
                  result = result.replace(old, new)
              return result

          def build_day_prompt(knowledge, day, date):
              pillar_lines = "\n".join(f"- {p}" for p in PILLARS)
              section_lines = "\n".join(f"### {s}" for s in SECTIONS)

              hashtag_ref = []
              for platform, tags in PLATFORM_HASHTAGS.items():
                  hashtag_ref.append(f"\n{platform}:")
                  hashtag_ref.append("  " + " ".join(tags))
              hashtag_reference = "\n".join(hashtag_ref)

              return f"""
          You are the STRAYD Content Director and executable social-content agent.

          YOUR MISSION
          Generate content for EXACTLY ONE DAY: {day} — {date.isoformat()}

          KNOWLEDGE PRIORITY
          1. martinstrayd.md
          2. suzuki.md
          3. songarchive.md
          4. brand-profile.md

          FACTUAL RULES
          - Never invent songs, song titles, releases, release dates or credits.
          - Never invent biography, personal history or achievements.
          - Use only the supplied knowledge files for factual STRAYD claims.
          - NEVER use em dashes. Use plain hyphens only: -
          - NEVER use smart quotes. Use plain quotes only: ' and "

          PLATFORM HASHTAGS
          {hashtag_reference}

          OUTPUT FORMAT — STRICT
          Output Markdown only. Do not wrap in code blocks.
          Start with this EXACT header:
          ## {day} — {date.isoformat()}

          Include these seven sub-headings in this EXACT order:
          {section_lines}

          SUPPLIED KNOWLEDGE FILES
          {knowledge}
          """.strip()

          def call_dahl(prompt):
              payload = {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "system",
                          "content": (
                              "You are the STRAYD Content Director. "
                              "Return only the requested Markdown."
                          ),
                      },
                      {"role": "user", "content": prompt},
                  ],
                  "temperature": 0.7,
                  "max_tokens": 2500,
              }

              request_data = json.dumps(payload).encode("utf-8")

              for attempt in range(1, ATTEMPTS + 1):
                  request = urllib.request.Request(
                      API_URL,
                      data=request_data,
                      headers={
                          "Authorization": f"Bearer {API_KEY}",
                          "Content-Type": "application/json",
                          "Accept": "application/json",
                      },
                      method="POST",
                  )

                  try:
                      log(f"Sending request (attempt {attempt}/{ATTEMPTS})...")
                      with urllib.request.urlopen(request, timeout=120) as response:
                          raw = response.read().decode("utf-8")
                          data = json.loads(raw)

                      choices = data.get("choices") or []
                      if not choices:
                          raise ValueError("DAHL response contains no choices.")

                      content = choices[0].get("message", {}).get("content")
                      if not isinstance(content, str) or not content.strip():
                          raise ValueError("DAHL returned empty content.")

                      return content.strip()

                  except urllib.error.HTTPError as exc:
                      code = exc.code
                      try:
                          body = exc.read().decode("utf-8", errors="replace")
                      except Exception:
                          body = ""

                      log(f"DAHL HTTP error {code}: {body[:300]}")
                      if code not in RETRY_CODES:
                          fail(f"Non-retryable HTTP error {code}.")

                      if attempt == ATTEMPTS:
                          fail(f"HTTP {code} persisted after {ATTEMPTS} attempts.")

                  except (urllib.error.URLError, TimeoutError, json.JSONDecodeError, ValueError) as exc:
                      log(f"DAHL connection error: {type(exc).__name__}: {exc}")
                      if attempt == ATTEMPTS:
                          fail(f"Request failed after {ATTEMPTS} attempts.")

                  delay = RETRY_DELAYS[attempt - 1]
                  log(f"Retrying in {delay} seconds...")
                  time.sleep(delay)

              fail("DAHL request ended unexpectedly.")

          def safe_write(path, content):
              path = Path(path)
              path.parent.mkdir(parents=True, exist_ok=True)

              target = path
              counter = 1

              while target.exists():
                  target = path.with_name(
                      f"{path.stem}-run-{RUN_NUMBER}"
                      f"{'' if counter == 1 else '-' + str(counter)}"
                      f"{path.suffix}"
                  )
                  counter += 1

              normalized = normalize_dashes(content.rstrip()) + "\n"

              with target.open("x", encoding="utf-8", newline="\n") as handle:
                  handle.write(normalized)

              log(f"Created {target}")
              return target

          def main():
              week_dates = current_week()
              knowledge = read_knowledge()
              daily_markdowns = []
              daily_sections = {}

              log(f"Generating daily social content for week starting {week_dates[0]}.")

              for day, date in zip(DAYS, week_dates):
                  log(f"--- Generating {day} ({date.isoformat()}) ---")
                  prompt = build_day_prompt(knowledge, day, date)
                  day_md = call_dahl(prompt)
                  daily_markdowns.append(day_md)
                  daily_sections[day] = day_md

              full_weekly_markdown = "\n\n".join(daily_markdowns)

              weekly_path = Path(
                  "social-posts/weekly/"
                  f"{week_dates[0].isoformat()}-calendar.md"
              )
              weekly_saved = safe_write(weekly_path, full_weekly_markdown)

              created_daily = []
              for day, date in zip(DAYS, week_dates):
                  slug = day.lower()
                  daily_path = Path(
                      "social-posts/daily/"
                      f"{date.isoformat()}-{slug}.md"
                  )

                  daily_content = (
                      f"# STRAYD Social Content - {day}, "
                      f"{date.isoformat()}\n\n"
                      f"Source calendar: {weekly_saved.as_posix()}\n\n"
                      f"{daily_sections[day]}"
                  )

                  created_daily.append(safe_write(daily_path, daily_content))

              readme = Path("social-posts/README.md")
              if not readme.exists():
                  readme.write_text(
                      "# STRAYD Social Content\n\n"
                      "- `weekly/` contains complete weekly calendars.\n"
                      "- `daily/` contains one Markdown file per day.\n\n"
                      "Generated by `.github/workflows/social-agent.yml`.\n",
                      encoding="utf-8",
                  )

              log("")
              log("SUCCESS: ALL 7 DAYS GENERATED INDIVIDUALLY AND SAVED")

          if __name__ == "__main__":
              main()
          PY

      - name: Commit generated social content
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add social-posts/

          if git diff --cached --quiet; then
            echo "No new social content changes to commit."
            exit 0
          fi

          git commit -m "Generate STRAYD weekly and daily social content"

          git push

          echo "Social content committed successfully."
