name: GDrive to GitHub Sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            knowledge
            characters
            content
          sparse-checkout-cone-mode: false

      - name: Install rclone
        run: |
          curl -sL https://rclone.org/install.sh | bash -s -- --user
          ~/rclone-v1.75.2-linux-amd64/rclone version

      - name: Configure GDrive
        env:
          RCLONE_TOKEN: ${{ secrets.RCLONE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << 'EOF'
          [gdrive]
          type = drive
          scope = drive
          token = {"access_token":"","access_token_expiry":"2026-01-01T00:00:00Z","refresh_token":"$RCLONE_TOKEN","token_type":"Bearer"}
          EOF
          ~/rclone-v1.75.2-linux-amd64/rclone lsd gdrive: --max-depth 1

      - name: Sync from GDrive
        run: |
          ~/rclone-v1.75.2-linux-amd64/rclone copy gdrive:1iO-VKSF03DirybwOmKPURNBw_YoRYRd7/knowledge/ knowledge/ --update --verbose || true
          ~/rclone-v1.75.2-linux-amd64/rclone copy gdrive:1iO-VKSF03DirybwOmKPURNBw_YoRYRd7/characters/ characters/ --update --verbose || true
          ~/rclone-v1.75.2-linux-amd64/rclone copy gdrive:1iO-VKSF03DirybwOmKPURNBw_YoRYRd7/content/ content/ --update --verbose || true

      - name: Show files
        run: |
          echo "=== Knowledge ==="
          find knowledge -name "*.md" 2>/dev/null | head -10
          echo "=== Characters ==="
          find characters -name "*.md" 2>/dev/null | head -10

      - name: Commit and push
        run: |
          git config user.name "GDrive Sync Bot"
          git config user.email "sync@strayd.com"
          git add -A
          git commit -m "Sync from GDrive $(date)" || echo "No changes"
          git push origin main || echo "Push done"
