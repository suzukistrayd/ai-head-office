name: GDrive to GitHub Sync

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            knowledge
            characters
            content
          sparse-checkout-cone-mode: false

      - name: Install rclone
        run: |
          curl -s https://rclone.org/install.sh | bash
          rclone version

      - name: Configure GDrive
        env:
          RCLONE_TOKEN: ${{ secrets.RCLONE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << 'EOF'
          [gdrive]
          type = drive
          scope = drive
          token = {"access_token":"","access_token_expiry":"2026-01-01T00:00:00Z","refresh_token":"$RCLONE_TOKEN","token_type":"Bearer"}
          EOF
          echo "=== Testing GDrive connection ==="
          rclone lsd gdrive: --max-depth 1 || echo "Connection test complete"

      - name: Sync from GDrive
        run: |
          echo "=== Syncing knowledge folder ==="
          rclone copy gdrive:1iO-VKSF03DirybwOmKPURNBw_YoRYRd7/knowledge/ knowledge/ --update --verbose || true
          
          echo "=== Syncing characters folder ==="
          rclone copy gdrive:1iO-VKSF03DirybwOmKPURNBw_YoRYRd7/characters/ characters/ --update --verbose || true
          
          echo "=== Syncing content folder ==="
          rclone copy gdrive:1iO-VKSF03DirybwOmKPURNBw_YoRYRd7/content/ content/ --update --verbose || true

      - name: Show synced files
        run: |
          echo "=== Knowledge files ==="
          find knowledge -name "*.md" 2>/dev/null | head -10
          echo ""
          echo "=== Character files ==="
          find characters -name "*.md" 2>/dev/null | head -10
          echo ""
          echo "=== Draft content ==="
          find content -name "*.txt" 2>/dev/null | head -5

      - name: Commit and push
        run: |
          git config user.name "GDrive Sync Bot"
          git config user.email "sync@strayd.com"
          git add -A
          git status --short
          git commit -m "Sync from GDrive $(date '+%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push origin main || echo "Push completed or skipped"
